server {
    listen 80;
    listen [::]:80;
    server_name test.wiltkey.org;

    # Dedicated host for the WiltKey TEST relay (Go, 127.0.0.1:8091).
    # Isolated instance: WK_TEST_MODE=true, own Postgres DB (wiltkey_test),
    # own Redis DB (2), own storage dir. Mirrors the api.wiltkey.org vhost.
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support for /ws (reuses map from default site)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
