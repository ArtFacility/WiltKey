server {
    listen 80;
    listen [::]:80;
    server_name test.wiltkey.org;

    # Dedicated host for the WiltKey TEST relay (Go, 127.0.0.1:8091).
    # Isolated instance: WK_TEST_MODE=true, own Postgres DB (wiltkey_test),
    # own Redis DB (2), own storage dir. Mirrors the api.wiltkey.org vhost.

    # Cloudflare edge ranges (www.cloudflare.com/ips) trusted for real-IP
    # recovery. Behind Cloudflare, $remote_addr at nginx is the CF EDGE, not
    # the client; the client's true IP rides in CF-Connecting-IP. Without this
    # recovery, every per-IP protection in the relay (rate limits, bans,
    # issuance caps, challenge strikes) keys on rotating CF edges and is
    # effectively disabled. (Found 2026-09-08: puzzle strikes never
    # accumulated because each attempt arrived from a different CF edge.)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 240b:b000::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 2a06:98c0::/29;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support for /ws (reuses map from default site)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
